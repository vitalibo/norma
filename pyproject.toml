[project]
name = "norma"
version = "0.2.0"
description = "Pandas & PySpark data validation via JSON Schema"
authors = [
    { name = "Vitaliy Boyarsky", email = "boyarsky.vitaliy@live.com" },
]
readme = "readme.md"
requires-python = ">=3.9"

dependencies = [
]

[dependency-groups]
dev = [
    "pandas==2.2.3",
    "pyspark==3.5.4",
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
    "isort==6.1.0",
    "vitalibo.pyxis==0.2.12",
    "setuptools==70.2.0",
]

[tool.isort]
line_length = 120
multi_line_output = 5
include_trailing_comma = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/norma"]
