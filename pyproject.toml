[project]
name = "norma"
version = "0.2.0"
description = "Pandas & PySpark data validation via JSON Schema"
authors = [
    { name = "Vitaliy Boyarsky", email = "boyarsky.vitaliy@live.com" },
]
readme = "readme.md"
requires-python = ">=3.9"

dependencies = [
]

[dependency-groups]
dev = [
    "pandas==2.2.3",
    "pyspark==3.5.4",
    "pytest==8.3.4",
    "pylint==3.0.3",
    "isort==5.13.2",
    "vitalibo.pyxis==0.2.12",
    "setuptools==70.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/norma"]
